name: OpenSSF Scorecard

# Rates the repository's security practices (branch protection, pinned dependencies,
# token permissions, signed releases, ...). Results: Security → Code scanning and
# https://scorecard.dev/viewer/?uri=github.com/vedranius/web-browser-RDM-public

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 5 * * 3'
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif

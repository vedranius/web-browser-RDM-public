# Web Remote Manager PRO — self-hosted with one command:
#   docker compose up -d        then open https://<host>:8080 and create the administrator account
#
# Back up the volume "wrm-data" (database, recordings) and keep a separate copy of the
# encryption key (/data/remote_manager.db.key, or your own ENCRYPTION_KEY_FILE secret).

services:
  wrm:
    build:
      context: .
      args:
        VERSION: v10.1.0-mimo
    image: wrm-pro:v10.1.0-mimo
    restart: unless-stopped
    ports:
      - "8080:8080"              # web UI (HTTPS with the self-signed certificate below)
      - "3478:3478/tcp"          # TURN relay for voice calls
      - "3478:3478/udp"
      - "49160-49200:49160-49200/udp"   # TURN relay ports (must match WRM_TURN_RELAY_PORTS)
    environment:
      HTTPS_SELF_SIGNED: "1"     # remove when a TLS reverse proxy is in front (then set WRM_TRUST_PROXY: "1")
      WRM_TURN_RELAY_PORTS: "49160-49200"
      # Voice relay from a container needs the IPv4 address browsers reach this host at:
      WRM_TURN_PUBLIC_IP: "${WRM_TURN_PUBLIC_IP:-}"
      # Optional: your own encryption key as a Docker secret instead of the generated key file
      # ENCRYPTION_KEY_FILE: /run/secrets/wrm_encryption_key
    volumes:
      - wrm-data:/data
    # secrets: [wrm_encryption_key]

volumes:
  wrm-data:

# secrets:
#   wrm_encryption_key:
#     file: ./wrm_encryption_key.txt   # 64 hex characters (openssl rand -hex 32)

# staticcheck (run by .github/workflows/security.yml). Default checks plus the style checks
# that do not fit this code base: error strings are shown to users as sentences (ST1005),
# and the HTTP status / time constant style checks (ST1013, ST1018) are noise here.
checks = ["all", "-ST1000", "-ST1003", "-ST1005", "-ST1013", "-ST1016", "-ST1018", "-ST1020", "-ST1021", "-ST1022", "-ST1023"]
